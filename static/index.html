<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>售后助手本地服务</title><style>*{box-sizing:border-box}body{margin:0;padding:32px 18px;background:#f5f8fb;color:#263b50;font:15px/1.65 "Microsoft YaHei","Noto Sans CJK SC",sans-serif}.card{max-width:640px;margin:auto;background:#fff;border:1px solid #e1eaf2;border-radius:18px;padding:24px}h1{font-size:23px;margin:0 0 8px}p{color:#586e83}.pill{display:inline-block;background:#eff8f2;border:1px solid #cfe9d5;border-radius:99px;padding:5px 10px;color:#2b7144;font-size:13px}code{background:#eef3f8;padding:2px 5px;border-radius:4px}li{margin:8px 0}.warn{background:#fff8e9;padding:12px;border-radius:10px;color:#735f35}</style></head><body><main class="card"><h1>售后助手本机服务</h1><span class="pill">服务已启动</span><p>本页提供本地 Agent 接口；对话界面在 Chromium 侧边栏插件中。插件加载后，普通网页会自动出现悬浮球。</p><ol><li>打开 Chrome 的 <code>chrome://extensions</code>，或 Edge 的 <code>edge://extensions</code>。</li><li>开启“开发者模式”，选择“加载解压缩的扩展程序”。</li><li>选择项目中的 <code>aftercare-agent/extension</code> 文件夹。随后打开普通网页即可看到悬浮球；点球体打开侧栏对话。</li></ol><p class="warn">当前是开发原型：仅本机保存任务，数据库未加密；网页自动操作、语音和真实平台适配尚未接入。请先使用虚构资料。</p></main></body></html>
